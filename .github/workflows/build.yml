name: Build DeltaSpeed

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build DeltaSpeed.csproj -c Release
      - uses: actions/upload-artifact@v3
        with:
          name: DeltaSpeed-dll
          path: bin/Release/net8.0-windows/DeltaSpeed.dll
